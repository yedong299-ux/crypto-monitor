name: Critical Funding & OI Monitor

on:
  schedule:
    # 每 15 分钟运行一次，错开整点减轻 GitHub 负载
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python -m src.main

      - name: Commit state (optional, for persistence)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add state.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update monitor state [skip ci]" || true
          git push || true
        continue-on-error: true
